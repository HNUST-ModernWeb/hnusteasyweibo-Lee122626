server:
  port: 8080

spring:
  application:
    name: mini-weibo-server
  datasource:
    url: jdbc:mysql://localhost:3306/mini_weibo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.weibo.entity
  configuration:
    map-underscore-to-camel-case: true